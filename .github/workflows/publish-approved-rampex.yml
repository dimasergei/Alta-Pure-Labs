name: Publish approved Rampex commit once
on:
  push:
    branches: [ops/publish-rampex-04a39e1]
    paths: [.github/workflows/publish-approved-rampex.yml]
permissions:
  contents: write
concurrency:
  group: publish-approved-rampex-04a39e1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 768b7b7ec566d2ceef6d14404aa731640ce0bdc0
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and import exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, pathlib, subprocess, urllib.request, zipfile
          base = '768b7b7ec566d2ceef6d14404aa731640ce0bdc0'
          head = '04a39e186dec1e4ffcd4ad60c982cd081c901840'
          url = 'https://sb-3r1aelmkzpl6.vercel.run/8a912ed1760d4448a66365628df729ccd6fd617d7ab887e4.zip'
          with urllib.request.urlopen(url, timeout=30) as response:
              source = response.read(3000001)
          assert len(source) <= 3000000, 'Unexpected artifact size'
          assert hashlib.sha256(source).hexdigest() == '70580efed2b5b8b05610f895f56999a773b2ebc92e5a6593ff698d385db81482', 'Source checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(source)) as archive:
              bundle = archive.read('rampex-order-integration.bundle')
          assert hashlib.sha256(bundle).hexdigest() == '057f1d3bbc70fcdbb91378c295195aa7ea26fb4d2c71314ca0a0260d57f5511a', 'Bundle checksum mismatch'
          pathlib.Path('/tmp/approved-rampex.bundle').write_bytes(bundle)
          subprocess.run(['git', 'bundle', 'verify', '/tmp/approved-rampex.bundle'], check=True)
          subprocess.run(['git', 'fetch', '/tmp/approved-rampex.bundle', 'HEAD'], check=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'FETCH_HEAD') == head, 'Unexpected commit'
          assert git('rev-parse', head + '^') == base, 'Unexpected base'
          expected = {'admin-gateways.html','direct-checkout-client.js','docs/rampex-connection-stage.md','docs/rampex-order-integration.md','lib/gateway-config.js','lib/gateway-public.js','lib/native-gateway.js','lib/rampex-connection.js','lib/rampex-payments.js','lib/rampex.js','native-pay.js','pay.html','supabase/migrations/20261112211215_rampex_order_payment_mapping.sql','tests/fixtures/rampex-checks.sql','tests/fixtures/rampex-race.py','tests/rampex-payments.test.cjs'}
          assert set(git('diff', '--name-only', base, head).splitlines()) == expected, 'Unexpected changed files'
          migration = subprocess.check_output(['git', 'show', head + ':supabase/migrations/20261112211215_rampex_order_payment_mapping.sql'])
          assert hashlib.sha256(migration).hexdigest() == '4214b067a8feaf8a4957d616b2dfff23bb3426e9e3055361cb2d65871739a84e', 'Migration checksum mismatch'
          assert git('show', head + ':vercel.json') == git('show', base + ':vercel.json'), 'Deployment settings changed'
          print('Exact approved commit, parent, file list, migration and deployment configuration verified. No imported code executed.')
          PY
      - name: Publish reviewed branch without deployment or force push
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, subprocess
          token = os.environ.pop('PUBLISH_TOKEN')
          auth = base64.b64encode(('x-access-token:' + token).encode()).decode()
          env = dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'https://github.com/dimasergei/Alta-Pure-Labs.git', '04a39e186dec1e4ffcd4ad60c982cd081c901840:refs/heads/feature/rampex-order-integration'], env=env, check=True)
          print('Published exact reviewed commit. No production deployment, SQL, payment, or supplier action executed by this workflow.')
          PY
