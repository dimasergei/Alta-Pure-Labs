name: Publish reviewed AltaPure cart conflict fix
on:
  push:
    branches: [ops/publish-cartfix-2099485]
    paths: [.github/workflows/publish-cartfix-2099485.yml]
permissions:
  contents: write
concurrency:
  group: publish-cartfix-2099485
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 51a272e8294ddcef535c7d1458ec20ece321169a
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tested source checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,urllib.request
          base='51a272e8294ddcef535c7d1458ec20ece321169a'
          head='2099485c8ccb23289ba473f41685c71628f72acd'
          url='https://sb-1glsq4o50xeo.vercel.run/a696269b32c14414a0066a305bdc1b01.bundle'
          with urllib.request.urlopen(url,timeout=30) as response:
              data=response.read(1000001)
          assert 500<len(data)<=1000000,'Unexpected source size'
          assert hashlib.sha256(data).hexdigest()=='ec1116471117f14335d20a3f5745c7359c24eb023b9c86883e21cb94295b7550','Source checksum mismatch'
          pathlib.Path('/tmp/cartfix.bundle').write_bytes(data)
          subprocess.run(['git','bundle','verify','/tmp/cartfix.bundle'],check=True)
          subprocess.run(['git','fetch','/tmp/cartfix.bundle','HEAD'],check=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','FETCH_HEAD')==head,'Wrong commit'
          assert git('rev-parse',head+'^')==base,'Wrong parent'
          assert set(git('diff','--name-only',base,head).splitlines())==set(["config/checkout.json","conversion-build.cjs","direct-checkout-build.cjs","tests/conversion-pricing.test.cjs","tests/neuro-cart-layout.test.cjs"]),'Unapproved files'
          for name in ['api/checkout.js','lib/native-gateway.js','lib/direct-checkout.js','lib/rampex.js','lib/lotus-fulfillment.js','vercel.json']:
              assert git('show',head+':'+name)==git('show',base+':'+name),'Unapproved checkout/payment/fulfillment change: '+name
          print('Verified exact five-file cart-renderer fix. No secret, payment processor or database changes.')
          PY
      - name: Test and build exact source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 2099485c8ccb23289ba473f41685c71628f72acd
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm run test:account-dom
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('public-build/storefront-v2.js','utf8');
          assert.ok(s.includes('window.AltaCartNmi?.offer(root)'));
          assert.ok(!s.includes('window.ConversionUI.cart(root,cart)'));
          const c=JSON.parse(fs.readFileSync('config/checkout.json','utf8'));
          assert.equal(c.shipping_cents,1495);
          console.log('Verified production-build cart handoff, no legacy coupon form, consistent delivery price.');
          JS
      - name: Publish reviewed commit without force
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess
          token=os.environ.pop('PUBLISH_TOKEN')
          auth=base64.b64encode(('x-access-token:'+token).encode()).decode()
          env=dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0',GIT_CONFIG_COUNT='1',
             GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
             GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          subprocess.run(['git','push','https://github.com/dimasergei/Alta-Pure-Labs.git',
             '2099485c8ccb23289ba473f41685c71628f72acd:refs/heads/feature/reference-checkout-worldwide'],check=True,env=env)
          print('Published verified source. No checkout transaction or database write.')
          PY
