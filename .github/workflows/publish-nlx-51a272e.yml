name: Publish verified AltaPure checkout reference
on:
  push:
    branches: [ops/publish-nlx-51a272e]
    paths: [.github/workflows/publish-nlx-51a272e.yml]
permissions:
  contents: write
concurrency:
  group: publish-nlx-51a272e
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5e70fb095dfca7658f0c8fdc55abe18d170bff4d
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source without production access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,urllib.request
          base='5e70fb095dfca7658f0c8fdc55abe18d170bff4d'
          head='51a272e8294ddcef535c7d1458ec20ece321169a'
          url='https://sb-1glsq4o50xeo.vercel.run/6b8d559b35c94653b3c858e27df71428.bundle'
          with urllib.request.urlopen(url,timeout=30) as response:
              content=response.read(2000001)
          assert 1000<len(content)<=2000000,'Unexpected file size'
          assert hashlib.sha256(content).hexdigest()=='46e21a65d8f7b43e35df08d7abd5fe281cd05ed96a54f3161382ac656a562bbc','Source checksum mismatch'
          pathlib.Path('/tmp/checkout-source.bundle').write_bytes(content)
          subprocess.run(['git','bundle','verify','/tmp/checkout-source.bundle'],check=True)
          subprocess.run(['git','fetch','/tmp/checkout-source.bundle','HEAD'],check=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','FETCH_HEAD')==head,'Unexpected commit'
          assert git('rev-parse',head+'^')==base,'Unexpected base'
          expected=set(["cart-nmi-express.js","cart-reference.css","cart-reference.js","checkout-reference.css","checkout-reference.js","config/checkout.json","config/delivery-options.json","config/shipping-countries.json","config/shipping-zones.json","direct-checkout-build.cjs","lib/delivery-options.js","lib/direct-checkout.js","nmi-inline-checkout.js","shipping-protection.html","site-build.cjs","storefront-v2.js","supabase/migrations/20261113124000_global_checkout_delivery_options.sql","tests/direct-checkout.test.cjs","tests/neuro-cart-layout.test.cjs","tests/neuro-checkout-layout.test.cjs","tests/readiness.test.cjs"])
          assert set(git('diff','--name-only',base,head).splitlines())==expected,'Unexpected changed files'
          migration=subprocess.check_output(['git','show',head+':supabase/migrations/20261113124000_global_checkout_delivery_options.sql'])
          assert hashlib.sha256(migration).hexdigest()=='e7355fb982429c7b217780b08e54c50e897b72e98538e9d7345e73d39689b2e8','Migration mismatch'
          for path in ['vercel.json','api/checkout.js','lib/native-gateway.js','lib/rampex.js','lib/rampex-payments.js','lib/lotus-fulfillment.js']:
              assert git('show',base+':'+path)==git('show',head+':'+path),'Unapproved core payment/fulfillment change: '+path
          print('Exact 21 file allowlist and migration hash verified.')
          PY
      - name: Test and build exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 51a272e8294ddcef535c7d1458ec20ece321169a
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm run test:account-dom
      - name: Publish verified feature without force-pushing
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess
          token=os.environ.pop('PUBLISH_TOKEN')
          auth=base64.b64encode(('x-access-token:'+token).encode()).decode()
          env=dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0',GIT_CONFIG_COUNT='1',
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
            GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          subprocess.run(['git','push','https://github.com/dimasergei/Alta-Pure-Labs.git',
            '51a272e8294ddcef535c7d1458ec20ece321169a:refs/heads/feature/reference-checkout-worldwide'],check=True,env=env)
          print('Published source only; no production charge, migration or deployment.')
          PY
