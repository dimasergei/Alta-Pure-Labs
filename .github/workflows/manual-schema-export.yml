name: Manual read-only schema inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-inspection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export-schema:
    name: Export catalog metadata and encrypt artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: schema-export-readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed exporter dependency
        run: python -m pip install "psycopg[binary]==3.2.9"
      - name: Prepare connection from protected environment secret
        env:
          SUPABASE_READONLY_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import os,re,shlex
          from urllib.parse import urlparse,unquote
          parsed=urlparse(os.environ["SUPABASE_READONLY_DB_URL"])
          if parsed.scheme not in ("postgres","postgresql") or not parsed.hostname or not parsed.username or not parsed.password:
              raise SystemExit("Database URL is incomplete or invalid.")
          host=parsed.hostname; port=str(parsed.port or 5432); db=parsed.path.lstrip("/") or "postgres"
          user=unquote(parsed.username); password=unquote(parsed.password)
          if not re.fullmatch(r"[A-Za-z0-9.-]+",host) or any("\n" in v or "\r" in v for v in (host,port,db,user,password)):
              raise SystemExit("Database URL fields are invalid.")
          pgpass=os.path.join(os.environ["RUNNER_TEMP"],"schema-export.pgpass")
          esc=lambda v:v.replace("\\","\\\\").replace(":","\\:")
          with open(pgpass,"w") as f: f.write(":".join(map(esc,(host,port,db,user,password)))+"\n")
          os.chmod(pgpass,0o600)
          values={"PGHOST":host,"PGPORT":port,"PGDATABASE":db,"PGUSER":user,"PGPASSFILE":pgpass,"PGSSLMODE":"require"}
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in values.items(): f.write(f"{k}={v}\n")
          PY
      - name: Export fixed PostgreSQL catalog queries only
        env:
          SCHEMA_INSPECTION_OUTPUT: ${{ runner.temp }}/application-catalog.json
        run: |
          set -euo pipefail
          python scripts/export_schema.py
      - name: Screen definitions for common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/application-catalog.json"
          if grep -Eiq "sk_(live|test)_[A-Za-z0-9]{16,}|rk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|SG\.[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|postgres(ql)?://[^[:space:]]+" "$file"; then
            echo "::error::Potential credential pattern detected; export blocked."
            exit 1
          fi
          echo "Credential-pattern screen passed; it is precautionary, not a safety guarantee."
      - name: Encrypt using passphrase file descriptor
        env:
          SCHEMA_EXPORT_PASSPHRASE: ${{ secrets.SCHEMA_EXPORT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/application-catalog.json"
          encrypted="$RUNNER_TEMP/application-catalog.json.gpg"
          cleanup() { status=$?; rm -f "$file" "$RUNNER_TEMP/schema-export.pgpass"; if [[ $status -ne 0 ]]; then rm -f "$encrypted"; fi; exit "$status"; }
          trap cleanup EXIT
          if [[ -z "${SCHEMA_EXPORT_PASSPHRASE:-}" || "${#SCHEMA_EXPORT_PASSPHRASE}" -lt 24 ]]; then
            echo "::error::Encryption passphrase is missing or too short."
            exit 1
          fi
          printf '%s' "$SCHEMA_EXPORT_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$encrypted" "$file"
          unset SCHEMA_EXPORT_PASSPHRASE
          test -s "$encrypted"
          echo "Catalog export encrypted."
      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-application-catalog-review-${{ github.run_id }}
          path: ${{ runner.temp }}/application-catalog.json.gpg
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary export material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/application-catalog.json" "$RUNNER_TEMP/application-catalog.json.gpg" "$RUNNER_TEMP/schema-export.pgpass"
