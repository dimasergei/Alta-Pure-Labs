name: Manual read-only schema inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-schema:
    name: Export and encrypt public schema definitions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: schema-export-readonly
    steps:
      - name: Install PostgreSQL client and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client gnupg

      - name: Export public schema definitions only
        env:
          SUPABASE_READONLY_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${SUPABASE_READONLY_DB_URL:-}" ]]; then
            echo "::error::Configure SUPABASE_READONLY_DB_URL in the schema-export-readonly environment."
            exit 1
          fi

          export PGPASSFILE="$RUNNER_TEMP/pgpass"
          trap 'rm -f "$PGPASSFILE" "$RUNNER_TEMP/application-schema.sql"' EXIT

          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlparse, unquote

          url = urlparse(os.environ["SUPABASE_READONLY_DB_URL"])
          if url.scheme not in ("postgres", "postgresql"):
              raise SystemExit("The database URL must use postgres:// or postgresql://.")
          if not url.hostname or not url.username or not url.password:
              raise SystemExit("The database URL is incomplete.")

          host = url.hostname
          port = str(url.port or 5432)
          database = url.path.lstrip("/") or "postgres"
          username = unquote(url.username)
          password = unquote(url.password)
          fields = [host, port, database, username, password]
          if any("\n" in value or "\r" in value for value in fields):
              raise SystemExit("The database URL contains invalid line breaks.")
          if not re.fullmatch(r"[A-Za-z0-9.-]+", host):
              raise SystemExit("The database hostname contains unsupported characters.")

          escape = lambda value: value.replace("\\", "\\\\").replace(":", "\\:")
          with open(os.environ["PGPASSFILE"], "w", encoding="utf-8") as handle:
              handle.write(":".join(escape(value) for value in fields) + "\n")
          os.chmod(os.environ["PGPASSFILE"], 0o600)

          env_values = {
              "PGHOST": host,
              "PGPORT": port,
              "PGDATABASE": database,
              "PGUSER": username,
              "PGSSLMODE": "require",
              "PGPASSFILE": os.environ["PGPASSFILE"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in env_values.items():
                  handle.write(f"{key}={value}\n")
          PY

          unset SUPABASE_READONLY_DB_URL
          pg_dump \
            --schema-only \
            --schema=public \
            --format=plain \
            --no-password \
            --file="$RUNNER_TEMP/application-schema.sql"

          rm -f "$PGPASSFILE"

      - name: Block export if common credential patterns are present
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_FILE="$RUNNER_TEMP/application-schema.sql"
          if grep -Eiq "sk_(live|test)_[A-Za-z0-9]{16,}|rk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|SG\.[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|postgres(ql)?://[^[:space:]]+" "$SCHEMA_FILE"; then
            echo "::error::Potential embedded credential detected. Export blocked; inspect securely before sharing."
            exit 1
          fi
          echo "Credential-pattern screen passed. It is not a substitute for human review of function bodies."

      - name: Encrypt schema artifact before upload
        env:
          SCHEMA_EXPORT_PASSPHRASE: ${{ secrets.SCHEMA_EXPORT_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SCHEMA_EXPORT_PASSPHRASE:-}" || "${#SCHEMA_EXPORT_PASSPHRASE}" -lt 24 ]]; then
            echo "::error::Configure a unique SCHEMA_EXPORT_PASSPHRASE of at least 24 characters in the schema-export-readonly environment."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SCHEMA_EXPORT_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/application-schema.sql.gpg" \
            "$RUNNER_TEMP/application-schema.sql"
          rm -f "$RUNNER_TEMP/application-schema.sql"
          echo "Schema export encrypted; plaintext will not be uploaded."

      - name: Upload encrypted one-day artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-application-schema-review-${{ github.run_id }}
          path: ${{ runner.temp }}/application-schema.sql.gpg
          if-no-files-found: error
          retention-days: 1
