name: Lotus routing checks
on:
  pull_request:
    paths:
      - 'lib/lotus-*.js'
      - 'lib/order-ledger-reconciliation.js'
      - 'lib/lotus-admin.js'
      - 'admin-fulfillment.js'
      - 'admin-orders.html'
      - 'tests/lotus-*.test.cjs'
      - 'tests/order-ledger-reconciliation.test.cjs'
      - '.github/workflows/lotus-routing.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check admin-fulfillment.js
          node --check lib/lotus-admin.js
          node --check lib/lotus-order-routing.js
          node --check lib/order-ledger-reconciliation.js
      - name: Isolated routing and reconciliation tests
        run: node --test tests/lotus-order-routing.test.cjs tests/order-ledger-reconciliation.test.cjs
