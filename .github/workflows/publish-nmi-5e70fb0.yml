name: Publish validated NMI embedded checkout feature
on:
  push:
    branches: [ops/publish-nmi-5e70fb0]
    paths: [.github/workflows/publish-nmi-5e70fb0.yml]
permissions:
  contents: write
concurrency:
  group: publish-nmi-5e70fb0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b8e093737c77e9463f171a621676bf5b28cde78f
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact reviewed source without applying production changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,urllib.request
          base='b8e093737c77e9463f171a621676bf5b28cde78f'
          head='5e70fb095dfca7658f0c8fdc55abe18d170bff4d'
          url='https://sb-4f7sbeyu3zvm.vercel.run/ac2ed047d56c4c4ba4c4855c6d92028c.bundle'
          with urllib.request.urlopen(url,timeout=30) as response:
              bundle=response.read(2000001)
          assert 1000<len(bundle)<=2000000,'Unexpected bundle size'
          assert hashlib.sha256(bundle).hexdigest()=='1b2e6479323cb07477db49ed1495a71bebbea84c1e007505c2941cc34f8bea94','Source hash mismatch'
          pathlib.Path('/tmp/nmi-release.bundle').write_bytes(bundle)
          subprocess.run(['git','bundle','verify','/tmp/nmi-release.bundle'],check=True)
          subprocess.run(['git','fetch','/tmp/nmi-release.bundle','HEAD'],check=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','FETCH_HEAD')==head,'Unexpected commit'
          assert git('rev-parse',head+'^')==base,'Unexpected parent'
          expected=set(["account-experience.css","cart-nmi-express.js","direct-checkout-build.cjs","direct-checkout-client.js","lib/direct-checkout.js","nmi-inline-checkout.js","site-build.cjs","storefront-v2.css","storefront-v2.js","tests/nmi-gated-checkout.test.cjs","tests/readiness.test.cjs"])
          assert set(git('diff','--name-only',base,head).splitlines())==expected,'Unexpected changed files'
          for path in ['vercel.json','api/checkout.js','lib/native-gateway.js','lib/rampex.js','lib/rampex-payments.js','lib/lotus-fulfillment.js']:
              assert git('show',base+':'+path)==git('show',head+':'+path),'Live payment/fulfillment unexpectedly changed: '+path
          assert git('show',head+':nmi-inline-checkout.js').find('checkout.rampex.io')<0,'No crypto onramp permitted in NMI widget'
          print('Verified only the exact reviewed feature files; no credentials, production DB, provider activation or payment writes.')
          PY
      - name: Independent tests and build using local fixtures only
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 5e70fb095dfca7658f0c8fdc55abe18d170bff4d
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm run test:account-dom
      - name: Publish validated feature branch without force push
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess
          token=os.environ.pop('PUBLISH_TOKEN')
          auth=base64.b64encode(('x-access-token:'+token).encode()).decode()
          env=dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0',GIT_CONFIG_COUNT='1',
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
            GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+auth)
          subprocess.run(['git','push','https://github.com/dimasergei/Alta-Pure-Labs.git',
            '5e70fb095dfca7658f0c8fdc55abe18d170bff4d:refs/heads/feature/nmi-inline-wallet-checkout'],check=True,env=env)
          print('Published gated NMI feature only. No production deployment, merchant credential activation, or card charge.')
          PY
