name: Publish validated unified AltaPure Orders
on:
  push:
    branches: [ops/publish-unified-b8e0937]
    paths: [.github/workflows/publish-unified-b8e0937.yml]
permissions:
  contents: write
concurrency:
  group: publish-unified-b8e0937
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 90cf0676ff960265c82bf6b3103974709d6d788c
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, urllib.request
          base='90cf0676ff960265c82bf6b3103974709d6d788c'
          head='b8e093737c77e9463f171a621676bf5b28cde78f'
          url='https://sb-1ob6z3opob4t.vercel.run/598be719d232416fb32a51a0d61ef740.bundle'
          with urllib.request.urlopen(url,timeout=30) as response:
              b=response.read(5000001)
          assert 1000<len(b)<=5000000,'Unexpected artifact size'
          assert hashlib.sha256(b).hexdigest()=='eb5e98d10540f2ee0d5a3921af5be6158e069b007daa8febf9dca999966066e9','Unexpected source bundle checksum'
          pathlib.Path('/tmp/altapure-unified.bundle').write_bytes(b)
          subprocess.run(['git','bundle','verify','/tmp/altapure-unified.bundle'],check=True)
          subprocess.run(['git','fetch','/tmp/altapure-unified.bundle','HEAD'],check=True)
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','FETCH_HEAD')==head,'Unexpected commit'
          assert git('rev-parse',head+'^')==base,'Unexpected base'
          expected=set(["account-experience.css","admin-fulfillment.css","admin-fulfillment.js","admin-orders.html","admin-unified-notifications.js","direct-checkout-client.js","lib/commerce-cancellation.js","lib/customer-order-email.js","lib/direct-checkout.js","lib/invoice-notifications.js","lib/lotus-admin.js","lib/order-display.js","lib/unified-admin-actions.js","supabase/migrations/20261113030240_safe_checkout_cancellation.sql","tests/admin-dashboard-ui.test.cjs","tests/fixtures/safe-checkout-cancellation-checks.sql","tests/safe-cancellation-and-brand-email.test.cjs","tests/unified-fulfillment-ui.test.cjs"])
          assert set(git('diff','--name-only',base,head).splitlines())==expected,'Unexpected changed files'
          sql=subprocess.check_output(['git','show',head+':supabase/migrations/20261113030240_safe_checkout_cancellation.sql'])
          assert hashlib.sha256(sql).hexdigest()=='cf3c3ff3c4ec3ff6103ca982d87b832e0ac1bbbbb2066099550e0adf51c1e306','Migration checksum mismatch'
          for path in ['vercel.json','api/checkout.js','lib/rampex.js','lib/rampex-payments.js','lib/lotus-fulfillment.js']:
              assert git('show',base+':'+path)==git('show',head+':'+path),'Unapproved provider, fulfillment or deployment modification: '+path
          print('Exactly 18 reviewed files; no secrets, gateway changes, supplier changes or deployment-setting changes.')
          PY
      - name: Test exact source without production access
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach b8e093737c77e9463f171a621676bf5b28cde78f
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm run test:account-dom
      - name: Publish exact reviewed branch without force
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess
          token=os.environ.pop('PUBLISH_TOKEN')
          proof=base64.b64encode(('x-access-token:'+token).encode()).decode()
          env=dict(os.environ)
          env.update(GIT_TERMINAL_PROMPT='0',GIT_CONFIG_COUNT='1',
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+proof)
          subprocess.run(['git','push','https://github.com/dimasergei/Alta-Pure-Labs.git',
              'b8e093737c77e9463f171a621676bf5b28cde78f:refs/heads/feature/unified-orders-and-safe-cancellation'],check=True,env=env)
          print('Published reviewed source. No migration, live transaction or deployment occurred within this job.')
          PY
