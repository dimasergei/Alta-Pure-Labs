name: Publish approved hosted checkout once
on:
  push:
    branches: [ops/publish-rampex-hosted-a2f952f]
    paths: [.github/workflows/publish-hosted-once.yml]
permissions:
  contents: write
concurrency:
  group: publish-rampex-hosted-a2f952f
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 04a39e186dec1e4ffcd4ad60c982cd081c901840
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and import reviewed commit without executing imported code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, urllib.request
          base='04a39e186dec1e4ffcd4ad60c982cd081c901840'
          head='a2f952f6970376f9736cdcf0c8b9682c0d9c07f1'
          url='https://sb-6o3c80fx3etc.vercel.run/110628ba4db4c74f9bc00b01381a0edcf58023bcd4c11853.bundle'
          with urllib.request.urlopen(url, timeout=30) as response:
              data=response.read(1000001)
          assert len(data)<1000000
          assert hashlib.sha256(data).hexdigest()=='a9cb481c970d62246300ba362e2c75e4a4c66d1d899276758ba77c5555a967d5'
          pathlib.Path('/tmp/hosted.bundle').write_bytes(data)
          subprocess.run(['git','bundle','verify','/tmp/hosted.bundle'],check=True)
          subprocess.run(['git','fetch','/tmp/hosted.bundle','HEAD'],check=True)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','FETCH_HEAD')==head
          assert git('rev-parse',head+'^')==base
          expected={'admin-gateways.html','docs/rampex-multi-hosted.md','lib/gateway-public.js','lib/rampex-connection.js','lib/rampex-payments.js','lib/rampex-protocol.js','lib/rampex.js','native-pay.js','supabase/migrations/20261112221052_rampex_multi_hosted.sql','tests/fixtures/rampex-hosted-checks.sql','tests/rampex-hosted.test.cjs','tests/rampex-payments.test.cjs','tests/rampex-protocol.test.cjs'}
          assert set(git('diff','--name-only',base,head).splitlines())==expected
          migration=subprocess.check_output(['git','show',head+':supabase/migrations/20261112221052_rampex_multi_hosted.sql'])
          assert hashlib.sha256(migration).hexdigest()=='925d3f28206f30e1caa9272b00ba6029ad241dd3b5a477b07a3425bfc9569aac'
          assert git('show',head+':vercel.json')==git('show',base+':vercel.json')
          print('Exact reviewed commit, parent, changed-file set, migration and deployment settings verified.')
          PY
      - name: Publish only reviewed branch without force or deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          askpass="$RUNNER_TEMP/hosted-git-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "x-access-token" ;; *Password*) printf "%s\n" "$GH_TOKEN" ;; *) exit 1 ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push https://github.com/dimasergei/Alta-Pure-Labs.git a2f952f6970376f9736cdcf0c8b9682c0d9c07f1:refs/heads/feature/rampex-multi-hosted
