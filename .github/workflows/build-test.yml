name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node tests, catalog exporter tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Run existing Node tests
        run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog exporter dependency
        run: python -m pip install "psycopg[binary]==3.2.9"
      - name: Create disposable PostgreSQL fixture
        env:
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f tests/fixtures/schema-inspection.sql
      - name: Run catalog exporter integration tests
        env:
          SCHEMA_TEST_DSN: postgresql://schema_inspector:fixture-only-password@127.0.0.1:5432/postgres
        run: python -m unittest tests.test_schema_export -v
      - name: Build storefront
        run: npm run build
