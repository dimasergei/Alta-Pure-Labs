<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Orders — AltaPure Labs</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23163832'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='22' font-family='Arial' fill='white'%3EAP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-page {
      min-height: 100svh;
      padding: 32px var(--gutter) 80px;
      background: #f4f6f5;
    }

    .admin-shell {
      max-width: 1180px;
      margin: auto;
    }

    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .admin-title {
      margin: 0;
      font-size: clamp(28px, 4vw, 40px);
    }

    .admin-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .admin-card {
      background: #fff;
      border: 1px solid #e3e7e6;
      padding: clamp(22px, 4vw, 36px);
    }

    .login-card {
      max-width: 460px;
      margin: 60px auto 0;
      text-align: center;
    }

    .login-card h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .login-card p {
      color: var(--muted);
      margin-bottom: 26px;
    }

    .login-field {
      display: grid;
      gap: 8px;
      text-align: left;
      margin-bottom: 18px;
    }

    .login-field label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .login-field input {
      padding: 15px;
      border: 1px solid #c8d0cd;
      background: #fff;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .toolbar-count {
      color: var(--muted);
      font-size: 14px;
    }

    .orders {
      display: grid;
      gap: 18px;
    }

    .order {
      border: 1px solid #e3e7e6;
      background: #fff;
      overflow: hidden;
    }

    .order-header {
      display: grid;
      grid-template-columns: 1.4fr .8fr .7fr;
      gap: 18px;
      align-items: center;
      padding: 20px 24px;
      background: #fafbfb;
      border-bottom: 1px solid #e3e7e6;
    }

    .order-label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .order-number {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .order-total {
      font-size: 20px;
      font-weight: 700;
      text-align: right;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 7px 13px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .status-paid {
      background: #e7f3ee;
      color: #166534;
    }

    .status-processing {
      background: #fdf3e2;
      color: #92400e;
    }

    .status-shipped {
      background: #e8f0fd;
      color: #1d4ed8;
    }

    .status-delivered {
      background: #e7f3ee;
      color: #166534;
    }

    .status-canceled {
      background: #fdeaea;
      color: #991b1b;
    }

    .order-body {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 24px;
      padding: 24px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .customer-block strong {
      display: block;
      font-size: 17px;
    }

    .customer-block .muted {
      display: block;
      margin-top: 4px;
    }

    .items {
      border: 1px solid #e3e7e6;
      background: #fafbfb;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 16px;
      border-bottom: 1px solid #e3e7e6;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: 600;
    }

    .item-variant {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .address {
      color: var(--muted);
      line-height: 1.55;
    }

    .address strong {
      color: var(--ink);
    }

    .fulfillment {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid #e3e7e6;
    }

    .fulfillment-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .fulfillment-grid .full {
      grid-column: 1 / -1;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #c8d0cd;
      background: #fff;
      font: inherit;
    }

    .field textarea {
      min-height: 78px;
      resize: vertical;
    }

    .save-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .save-button {
      min-width: 170px;
    }

    .empty {
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: #991b1b;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .order-header {
        grid-template-columns: 1fr;
      }

      .order-total {
        text-align: left;
      }

      .order-body {
        grid-template-columns: 1fr;
      }

      .fulfillment-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="admin-page">
    <div class="admin-shell">
      <div id="login-view">
        <div class="admin-card login-card">
          <h2>Admin access</h2>
          <p>Enter your admin password to view and manage orders.</p>

          <div class="login-field">
            <label for="admin-password">Admin password</label>
            <input id="admin-password" type="password" autocomplete="current-password">
          </div>

          <button id="login-button" class="pill pill-dark" type="button">View orders</button>
          <p id="login-error" class="error" hidden></p>
        </div>
      </div>

      <div id="orders-view" hidden>
        <div class="admin-topbar">
          <div>
            <h1 class="admin-title">Orders</h1>
            <p class="admin-subtitle" id="orders-message">Loading orders…</p>
          </div>
          <a class="pill pill-ghost" href="/">Back to site</a>
        </div>

        <div class="admin-card">
          <div class="toolbar">
            <span class="toolbar-count" id="order-count"></span>
            <button id="refresh-button" class="pill pill-ghost" type="button">Refresh</button>
          </div>

          <div id="orders-list" class="orders"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const passwordInput = document.querySelector('#admin-password');
    const loginButton = document.querySelector('#login-button');
    const loginError = document.querySelector('#login-error');
    const loginView = document.querySelector('#login-view');
    const ordersView = document.querySelector('#orders-view');
    const ordersMessage = document.querySelector('#orders-message');
    const orderCount = document.querySelector('#order-count');
    const ordersList = document.querySelector('#orders-list');
    const refreshButton = document.querySelector('#refresh-button');

    let adminPassword = sessionStorage.getItem('altapure_admin_password') || '';

    const money = (cents, currency = 'USD') =>
      new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency
      }).format(cents / 100);

    const escapeHtml = (value) =>
      String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

    const formatStatus = (status) => {
      const labels = {
        paid: 'Paid',
        processing: 'Processing',
        shipped: 'Shipped',
        delivered: 'Delivered',
        canceled: 'Canceled'
      };

      return labels[status] || status;
    };

    const formatDate = (value) => {
      if (!value) return '—';

      return new Date(value).toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    };

    async function loadOrders() {
      ordersMessage.textContent = 'Loading orders…';

      const response = await fetch('/api/admin-orders', {
        headers: {
          'x-admin-password': adminPassword
        }
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Unable to load orders.');
      }

      const data = await response.json();
      renderOrders(data.orders || []);
    }

    function renderOrders(orders) {
      ordersView.hidden = false;
      loginView.hidden = true;

      orderCount.textContent = `${orders.length} order${orders.length === 1 ? '' : 's'}`;
      ordersMessage.textContent = 'Manage fulfillment, tracking, and internal notes.';

      if (!orders.length) {
        ordersList.innerHTML = `
          <div class="empty">
            <p>No orders yet.</p>
          </div>`;
        return;
      }

      ordersList.innerHTML = orders.map((order) => {
        const address = order.shipping_address || {};
        const addressText = [
          address.line1,
          address.line2,
          [address.city, address.state, address.postal_code].filter(Boolean).join(', '),
          address.country
        ].filter(Boolean).join('<br>');

        const items = (order.store_order_items || [])
          .map(
            (item) => `
              <div class="item">
                <div>
                  <span class="item-name">${escapeHtml(item.product_name)}</span>
                  <span class="item-variant">${escapeHtml(item.variant_size)} × ${item.quantity}</span>
                </div>
                <strong>${money(item.quantity * item.unit_price_cents, order.currency)}</strong>
              </div>`
          )
          .join('');

        return `
          <article class="order" data-order-id="${escapeHtml(order.id)}">
            <div class="order-header">
              <div>
                <span class="order-label">Order</span>
                <span class="order-number">${escapeHtml(order.order_number || order.id)}</span>
                <span class="muted">${formatDate(order.created_at)}</span>
              </div>

              <div>
                <span class="order-label">Fulfillment</span>
                <span class="status-pill status-${escapeHtml(order.fulfillment_status)}">
                  ${escapeHtml(formatStatus(order.fulfillment_status))}
                </span>
              </div>

              <div>
                <span class="order-label">Total</span>
                <span class="order-total">${money(order.total_cents, order.currency)}</span>
              </div>
            </div>

            <div class="order-body">
              <div>
                <h3 class="section-title">Customer</h3>
                <div class="customer-block">
                  <strong>${escapeHtml(order.customer_name)}</strong>
                  <span class="muted">${escapeHtml(order.customer_email)}</span>
                  <span class="muted">${escapeHtml(order.organization || '')}</span>
                </div>

                <h3 class="section-title" style="margin-top:24px;">Items</h3>
                <div class="items">${items}</div>
              </div>

              <div>
                <h3 class="section-title">Shipping</h3>
                <p class="address">
                  <strong>${escapeHtml(order.shipping_name || '')}</strong><br>
                  ${addressText}
                </p>

                <div class="fulfillment">
                  <h3 class="section-title">Fulfillment</h3>

                  <form class="fulfillment-grid">
                    <label class="field">
                      Status
                      <select name="fulfillment_status">
                        ${['paid', 'processing', 'shipped', 'delivered', 'canceled']
                          .map(
                            (status) => `
                              <option value="${status}" ${order.fulfillment_status === status ? 'selected' : ''}>
                                ${formatStatus(status)}
                              </option>`
                          )
                          .join('')}
                      </select>
                    </label>

                    <label class="field">
                      Carrier
                      <input name="tracking_carrier" value="${escapeHtml(order.tracking_carrier || '')}">
                    </label>

                    <label class="field">
                      Tracking number
                      <input name="tracking_number" value="${escapeHtml(order.tracking_number || '')}">
                    </label>

                    <label class="field full">
                      Internal notes
                      <textarea name="admin_notes" rows="3">${escapeHtml(order.admin_notes || '')}</textarea>
                    </label>

                    <div class="save-row full">
                      <button class="pill pill-dark save-button" type="submit">Save changes</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </article>`;
      }).join('');

      ordersList.querySelectorAll('form').forEach((form) => {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const article = event.target.closest('.order');
          const orderId = article.dataset.orderId;
          const formData = new FormData(event.target);

          const button = event.target.querySelector('button');
          button.disabled = true;
          button.textContent = 'Saving…';

          try {
            const response = await fetch('/api/admin-orders', {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'x-admin-password': adminPassword
              },
              body: JSON.stringify({
                order_id: orderId,
                fulfillment_status: formData.get('fulfillment_status'),
                tracking_carrier: formData.get('tracking_carrier'),
                tracking_number: formData.get('tracking_number'),
                admin_notes: formData.get('admin_notes')
              })
            });

            if (!response.ok) {
              throw new Error('Update failed.');
            }

            button.textContent = 'Saved';
            await loadOrders();
          } catch (error) {
            button.textContent = 'Try again';
          } finally {
            button.disabled = false;
          }
        });
      });
    }

    async function attemptLogin() {
      adminPassword = passwordInput.value.trim();
      loginError.hidden = true;

      try {
        sessionStorage.setItem('altapure_admin_password', adminPassword);
        await loadOrders();
      } catch (error) {
        sessionStorage.removeItem('altapure_admin_password');
        loginError.textContent = error.message;
        loginError.hidden = false;
      }
    }

    loginButton.addEventListener('click', attemptLogin);

    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        attemptLogin();
      }
    });

    refreshButton.addEventListener('click', async () => {
      refreshButton.disabled = true;
      refreshButton.textContent = 'Refreshing…';

      try {
        await loadOrders();
      } catch (error) {
        ordersMessage.textContent = error.message;
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = 'Refresh';
      }
    });

    if (adminPassword) {
      loadOrders().catch(() => {
        sessionStorage.removeItem('altapure_admin_password');
      });
    }
  </script>
</body>
</html>
