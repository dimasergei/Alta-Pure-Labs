<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Orders — AltaPure Labs</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23163832'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='22' font-family='Arial' fill='white'%3EAP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --bg: #0a0e0f;
      --panel: #111617;
      --panel-soft: #161c1d;
      --border: #232b2c;
      --text: #e8edeb;
      --muted: #8d9a96;
      --teal: #59c2b4;
      --teal-dark: #17302c;
      --red: #ff8a8a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 "Plus Jakarta Sans", Arial, sans-serif;
    }

    .admin-page {
      min-height: 100svh;
      padding: 26px clamp(14px, 3vw, 40px) 80px;
    }

    .shell {
      max-width: 1180px;
      margin: auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.03em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: .2s ease;
    }

    .ghost:hover,
    .ghost:focus-visible {
      border-color: var(--teal);
      color: var(--teal);
    }

    .ghost:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .login {
      max-width: 420px;
      margin: 90px auto 0;
      padding: 34px;
      background: var(--panel);
      border: 1px solid var(--border);
      text-align: center;
    }

    .login h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .login p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
      text-align: left;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      background: #0d1213;
      color: var(--text);
      font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--teal);
    }

    .primary {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 100px;
      background: var(--teal);
      color: #06201d;
      font-weight: 700;
      cursor: pointer;
    }

    .primary:hover,
    .primary:focus-visible {
      filter: brightness(1.08);
    }

    .primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .error {
      margin: 12px 0 0;
      color: var(--red);
      font-size: 13px;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }

    .search {
      position: relative;
    }

    .search input {
      padding-left: 40px;
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.7;
    }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab {
      flex: 0 0 auto;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      transition: .2s ease;
    }

    .tab:hover,
    .tab:focus-visible {
      color: var(--text);
      border-color: #35403f;
    }

    .tab.active {
      background: var(--teal-dark);
      border-color: #2b5a53;
      color: var(--teal);
    }

    .bulkbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .bulkbar.visible {
      display: flex;
    }

    .bulk-count {
      color: var(--muted);
      font-size: 13px;
    }

    .bulk-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .orders {
      display: grid;
      gap: 8px;
    }

    .order {
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .row {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1.5fr) 90px 120px 30px;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .row:hover {
      background: var(--panel-soft);
    }

    .select-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid #3b4746;
      background: transparent;
      cursor: pointer;
    }

    .select-box.checked {
      background: var(--teal);
      border-color: var(--teal);
    }

    .select-box.checked::after {
      content: "✓";
      color: #06201d;
      font-size: 13px;
      font-weight: 800;
    }

    .order-number {
      font-size: 15px;
      font-weight: 700;
    }

    .order-date {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .customer strong {
      display: block;
      font-size: 14px;
    }

    .customer span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .total {
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .pill {
      display: inline-flex;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-paid,
    .status-delivered {
      background: var(--teal-dark);
      color: #7fd7c7;
    }

    .status-processing,
    .status-awaiting_supplier {
      background: #3a2c14;
      color: #f0c073;
    }

    .status-shipped {
      background: #182c44;
      color: #8db8ff;
    }

    .status-canceled,
    .status-refunded {
      background: #3d1c1c;
      color: #ff9a9a;
    }

    .chevron {
      color: var(--muted);
      text-align: center;
      transition: transform .2s ease;
    }

    .order.open .chevron {
      transform: rotate(180deg);
    }

    .details {
      display: none;
      padding: 0 16px 18px;
      border-top: 1px solid var(--border);
    }

    .order.open .details {
      display: block;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      padding-top: 18px;
    }

    .section-title {
      margin: 0 0 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .items {
      border: 1px solid var(--border);
      background: #0d1213;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: 600;
    }

    .item-variant {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .address {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .address strong {
      color: var(--text);
    }

    .mini-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .fulfillment {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .form-grid .field {
      margin: 0;
    }

    .form-grid textarea {
      min-height: 68px;
      resize: vertical;
    }

    .save-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .save-button {
      min-width: 155px;
    }

    .timeline {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      padding: 7px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .row {
        grid-template-columns: auto 1fr auto;
        grid-template-areas:
          "select number chevron"
          "select customer chevron"
          "select total status";
        row-gap: 8px;
      }

      .select-box { grid-area: select; }
      .number { grid-area: number; }
      .customer { grid-area: customer; }
      .total { grid-area: total; text-align: left; }
      .status { grid-area: status; justify-self: end; }
      .chevron { grid-area: chevron; }

      .details-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="admin-page">
    <div class="shell">
      <div id="login-view">
        <div class="login">
          <h2>Admin access</h2>
          <p>Enter your password to manage orders.</p>

          <div class="field">
            <label for="admin-password">Admin password</label>
            <input id="admin-password" type="password" autocomplete="current-password">
          </div>

          <button id="login-button" class="primary" type="button">View orders</button>
          <p id="login-error" class="error" hidden></p>
        </div>
      </div>

      <div id="orders-view" hidden>
        <div class="top">
          <div>
            <h1>Orders</h1>
            <p class="subtitle" id="orders-message">Loading orders…</p>
          </div>

          <div class="actions">
            <button id="refresh-button" class="ghost" type="button">Refresh</button>
            <a class="ghost" href="/">Site</a>
          </div>
        </div>

        <div class="controls">
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
            <input id="search-input" type="search" placeholder="Search order number, customer, email, organization, or tracking">
          </div>

          <div class="tabs" id="status-tabs">
            <button class="tab active" data-status="active" type="button">Active</button>
            <button class="tab" data-status="paid" type="button">Paid</button>
            <button class="tab" data-status="processing" type="button">Processing</button>
            <button class="tab" data-status="awaiting_supplier" type="button">Awaiting Supplier</button>
            <button class="tab" data-status="shipped" type="button">Shipped</button>
            <button class="tab" data-status="delivered" type="button">Delivered</button>
            <button class="tab" data-status="canceled" type="button">Canceled</button>
            <button class="tab" data-status="refunded" type="button">Refunded</button>
            <button class="tab" data-status="archived" type="button">Archived</button>
            <button class="tab" data-status="all" type="button">All</button>
          </div>
        </div>

        <div id="bulkbar" class="bulkbar">
          <span class="bulk-count" id="bulk-count">0 selected</span>

          <div class="bulk-actions">
            <button id="generate-pdf" class="ghost" type="button">Supplier PDF</button>
            <button id="archive-selected" class="ghost" type="button">Archive</button>
            <button id="restore-selected" class="ghost" type="button">Restore</button>
            <button id="clear-selection" class="ghost" type="button">Clear</button>
          </div>
        </div>

        <div id="orders-list" class="orders"></div>
      </div>
    </div>
  </main>

  <script>
    const passwordInput = document.querySelector('#admin-password');
    const loginButton = document.querySelector('#login-button');
    const loginError = document.querySelector('#login-error');
    const loginView = document.querySelector('#login-view');
    const ordersView = document.querySelector('#orders-view');
    const ordersMessage = document.querySelector('#orders-message');
    const ordersList = document.querySelector('#orders-list');
    const searchInput = document.querySelector('#search-input');
    const statusTabs = document.querySelector('#status-tabs');
    const bulkbar = document.querySelector('#bulkbar');
    const bulkCount = document.querySelector('#bulk-count');
    const generatePdf = document.querySelector('#generate-pdf');
    const archiveSelected = document.querySelector('#archive-selected');
    const restoreSelected = document.querySelector('#restore-selected');
    const clearSelection = document.querySelector('#clear-selection');
    const refreshButton = document.querySelector('#refresh-button');

    let adminPassword = sessionStorage.getItem('altapure_admin_password') || '';
    let currentStatus = 'active';
    let currentSearch = '';
    let selectedOrders = new Set();
    let loadedOrders = [];

    const money = (cents, currency = 'USD') =>
      new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency
      }).format(cents / 100);

    const escapeHtml = (value) =>
      String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

    const formatStatus = (status) => {
      const labels = {
        paid: 'Paid',
        processing: 'Processing',
        awaiting_supplier: 'Awaiting Supplier',
        shipped: 'Shipped',
        delivered: 'Delivered',
        canceled: 'Canceled',
        refunded: 'Refunded'
      };

      return labels[status] || status;
    };

    const formatDate = (value) => {
      if (!value) return '—';

      return new Date(value).toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    };

    async function loadOrders() {
      ordersMessage.textContent = 'Loading orders…';

      const params = new URLSearchParams({
        status: currentStatus,
        search: currentSearch,
        archived: currentStatus === 'archived' ? 'true' : 'false'
      });

      const response = await fetch(`/api/admin-orders?${params}`, {
        headers: {
          'x-admin-password': adminPassword
        }
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Unable to load orders.');
      }

      const data = await response.json();
      loadedOrders = data.orders || [];

      selectedOrders = new Set(
        [...selectedOrders].filter((id) =>
          loadedOrders.some((order) => order.id === id)
        )
      );

      renderOrders(loadedOrders);
    }

    function renderOrders(orders) {
      ordersView.hidden = false;
      loginView.hidden = true;

      ordersMessage.textContent = orders.length
        ? `${orders.length} order${orders.length === 1 ? '' : 's'} · click an order to expand`
        : 'No orders match this view.';

      if (!orders.length) {
        ordersList.innerHTML = `
          <div class="empty">
            <p>No orders match this view.</p>
          </div>`;
        updateBulkBar();
        return;
      }

      ordersList.innerHTML = orders.map((order) => {
        const address = order.shipping_address || {};
        const addressText = [
          address.line1,
          address.line2,
          [address.city, address.state, address.postal_code].filter(Boolean).join(', '),
          address.country
        ].filter(Boolean).join('<br>');

        const items = (order.store_order_items || [])
          .map(
            (item) => `
              <div class="item">
                <div>
                  <span class="item-name">${escapeHtml(item.product_name)}</span>
                  <span class="item-variant">${escapeHtml(item.variant_size)} × ${item.quantity}</span>
                </div>
                <strong>${money(item.quantity * item.unit_price_cents, order.currency)}</strong>
              </div>`
          )
          .join('');

        const timeline = (order.internal_status_history || [])
          .map(
            (entry) => `
              <div class="timeline-item">
                <span>${formatDate(entry.at)}</span>
                <span>${escapeHtml(formatStatus(entry.from))} → ${escapeHtml(formatStatus(entry.to))}</span>
              </div>`
          )
          .join('');

        return `
          <article class="order" data-order-id="${escapeHtml(order.id)}">
            <div class="row">
              <div class="select-box ${selectedOrders.has(order.id) ? 'checked' : ''}"
                   data-select="${escapeHtml(order.id)}"
                   role="checkbox"
                   aria-checked="${selectedOrders.has(order.id)}"
                   tabindex="0"></div>

              <div class="number">
                <span class="order-number">${escapeHtml(order.order_number || order.id)}</span>
                <span class="order-date">${formatDate(order.created_at)}</span>
              </div>

              <div class="customer">
                <strong>${escapeHtml(order.customer_name)}</strong>
                <span>${escapeHtml(order.customer_email)}</span>
              </div>

              <div class="total">${money(order.total_cents, order.currency)}</div>

              <div class="status">
                <span class="pill status-${escapeHtml(order.fulfillment_status)}">
                  ${escapeHtml(formatStatus(order.fulfillment_status))}
                </span>
              </div>

              <span class="chevron" aria-hidden="true">⌄</span>
            </div>

            <div class="details">
              <div class="details-grid">
                <div>
                  <h3 class="section-title">Customer</h3>
                  <p class="address">
                    <strong>${escapeHtml(order.customer_name)}</strong><br>
                    ${escapeHtml(order.customer_email)}<br>
                    ${escapeHtml(order.organization || '')}
                  </p>

                  <h3 class="section-title" style="margin-top:20px;">Items</h3>
                  <div class="items">${items}</div>
                </div>

                <div>
                  <h3 class="section-title">Shipping</h3>
                  <p class="address">
                    <strong>${escapeHtml(order.shipping_name || '')}</strong><br>
                    ${addressText}
                  </p>

                  <div class="mini-actions">
                    <button class="ghost" type="button" data-copy="address">Copy address</button>
                    <button class="ghost" type="button" data-copy="tracking">Copy tracking</button>
                  </div>

                  <div class="fulfillment">
                    <h3 class="section-title">Fulfillment</h3>

                    <form class="form-grid">
                      <label class="field">
                        Status
                        <select name="fulfillment_status">
                          ${['paid', 'processing', 'awaiting_supplier', 'shipped', 'delivered', 'canceled', 'refunded']
                            .map(
                              (status) => `
                                <option value="${status}" ${order.fulfillment_status === status ? 'selected' : ''}>
                                  ${formatStatus(status)}
                                </option>`
                            )
                            .join('')}
                        </select>
                      </label>

                      <label class="field">
                        Supplier status
                        <input name="supplier_status" value="${escapeHtml(order.supplier_status || '')}">
                      </label>

                      <label class="field">
                        Priority
                        <select name="priority">
                          ${['low', 'normal', 'high']
                            .map(
                              (priority) => `
                                <option value="${priority}" ${order.priority === priority ? 'selected' : ''}>
                                  ${priority}
                                </option>`
                            )
                            .join('')}
                        </select>
                      </label>

                      <label class="field">
                        Carrier
                        <input name="tracking_carrier" value="${escapeHtml(order.tracking_carrier || '')}">
                      </label>

                      <label class="field">
                        Tracking number
                        <input name="tracking_number" value="${escapeHtml(order.tracking_number || '')}">
                      </label>

                      <label class="field full">
                        Internal notes
                        <textarea name="admin_notes" rows="3">${escapeHtml(order.admin_notes || '')}</textarea>
                      </label>

                      <div class="save-row full">
                        <button class="primary save-button" type="submit">Save changes</button>
                      </div>
                    </form>
                  </div>

                  ${
                    timeline
                      ? `
                  <div class="timeline">
                    <h3 class="section-title">Timeline</h3>
                    ${timeline}
                  </div>`
                      : ''
                  }
                </div>
              </div>
            </div>
          </article>`;
      }).join('');

      attachOrderEvents();
      updateBulkBar();
    }

    function attachOrderEvents() {
      ordersList.querySelectorAll('.order-row').forEach((row) => {
        row.addEventListener('click', (event) => {
          if (event.target.closest('.select-box')) return;

          const order = row.closest('.order');
          const isOpen = order.classList.contains('open');

          ordersList.querySelectorAll('.order.open').forEach((openOrder) => {
            openOrder.classList.remove('open');
            openOrder.querySelector('.order-row').setAttribute('aria-expanded', 'false');
          });

          if (!isOpen) {
            order.classList.add('open');
            row.setAttribute('aria-expanded', 'true');
          }
        });
      });

      ordersList.querySelectorAll('.select-box').forEach((box) => {
        const toggle = () => {
          const orderId = box.dataset.select;

          if (selectedOrders.has(orderId)) {
            selectedOrders.delete(orderId);
            box.classList.remove('checked');
            box.setAttribute('aria-checked', 'false');
          } else {
            selectedOrders.add(orderId);
            box.classList.add('checked');
            box.setAttribute('aria-checked', 'true');
          }

          updateBulkBar();
        };

        box.addEventListener('click', (event) => {
          event.stopPropagation();
          toggle();
        });

        box.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggle();
          }
        });
      });

      ordersList.querySelectorAll('[data-copy]').forEach((button) => {
        button.addEventListener('click', async () => {
          const order = button.closest('.order');
          const orderId = order.dataset.orderId;
          const current = loadedOrders.find((item) => item.id === orderId);

          if (!current) return;

          if (button.dataset.copy === 'address') {
            const address = current.shipping_address || {};
            const text = [
              current.shipping_name,
              address.line1,
              address.line2,
              [address.city, address.state, address.postal_code].filter(Boolean).join(', '),
              address.country
            ].filter(Boolean).join('\n');

            await navigator.clipboard.writeText(text);
          }

          if (button.dataset.copy === 'tracking') {
            await navigator.clipboard.writeText(
              current.tracking_number || ''
            );
          }

          button.textContent = 'Copied';
          setTimeout(() => {
            button.textContent =
              button.dataset.copy === 'address' ? 'Copy address' : 'Copy tracking';
          }, 1400);
        });
      });

      ordersList.querySelectorAll('form').forEach((form) => {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const article = event.target.closest('.order');
          const orderId = article.dataset.orderId;
          const formData = new FormData(event.target);

          const button = event.target.querySelector('button');
          button.disabled = true;
          button.textContent = 'Saving…';

          try {
            const response = await fetch('/api/admin-orders', {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'x-admin-password': adminPassword
              },
              body: JSON.stringify({
                order_id: orderId,
                fulfillment_status: formData.get('fulfillment_status'),
                supplier_status: formData.get('supplier_status'),
                priority: formData.get('priority'),
                tracking_carrier: formData.get('tracking_carrier'),
                tracking_number: formData.get('tracking_number'),
                admin_notes: formData.get('admin_notes')
              })
            });

            if (!response.ok) {
              throw new Error('Update failed.');
            }

            button.textContent = 'Saved';
            await loadOrders();
          } catch (error) {
            button.textContent = 'Try again';
          } finally {
            button.disabled = false;
          }
        });
      });
    }

    function updateBulkBar() {
      bulkbar.classList.toggle('visible', selectedOrders.size > 0);
      bulkCount.textContent = `${selectedOrders.size} selected`;
    }

    function generateSupplierPdf() {
      const orders = loadedOrders.filter((order) =>
        selectedOrders.has(order.id)
      );

      if (!orders.length) return;

      const itemTotals = new Map();

      orders.forEach((order) => {
        (order.store_order_items || []).forEach((item) => {
          const key = `${item.product_name} — ${item.variant_size}`;
          const current = itemTotals.get(key) || 0;
          itemTotals.set(key, current + item.quantity);
        });
      });

      const reportWindow = window.open('', '_blank', 'width=900,height=900');

      if (!reportWindow) {
        alert('Allow pop-ups to generate the supplier PDF.');
        return;
      }

      reportWindow.document.write(`
        <html>
          <head>
            <title>AltaPure Labs — Supplier Fulfillment Report</title>
            <style>
              body { font-family: Arial, sans-serif; color: #111; padding: 40px; }
              h1 { margin: 0 0 4px; font-size: 24px; }
              h2 { margin: 28px 0 10px; font-size: 18px; }
              table { width: 100%; border-collapse: collapse; margin-top: 10px; }
              th, td { border: 1px solid #ccc; padding: 9px; text-align: left; }
              th { background: #f3f5f5; }
              .meta { color: #555; font-size: 13px; }
              .notice { margin-top: 32px; padding: 16px; background: #f8f4e8; font-size: 13px; }
            </style>
          </head>
          <body>
            <h1>AltaPure Labs</h1>
            <p class="meta">Supplier fulfillment report · ${new Date().toLocaleString()}</p>
            <p class="meta">Orders included: ${orders.length}</p>

            <h2>Consolidated items</h2>
            <table>
              <thead>
                <tr><th>Product</th><th>Size</th><th>Total quantity</th></tr>
              </thead>
              <tbody>
                ${[...itemTotals.entries()]
                  .map(
                    ([item, quantity]) => {
                      const [name, size] = item.split(' — ');
                      return `<tr><td>${escapeHtml(name)}</td><td>${escapeHtml(size)}</td><td>${quantity}</td></tr>`;
                    }
                  )
                  .join('')}
              </tbody>
            </table>

            <h2>Orders</h2>
            ${orders
              .map(
                (order) => `
                <div>
                  <h3>${escapeHtml(order.order_number || order.id)}</h3>
                  <p class="meta">
                    ${escapeHtml(order.shipping_name || '')}<br>
                    ${escapeHtml(
                      [
                        order.shipping_address?.line1,
                        order.shipping_address?.line2,
                        [
                          order.shipping_address?.city,
                          order.shipping_address?.state,
                          order.shipping_address?.postal_code
                        ].filter(Boolean).join(', '),
                        order.shipping_address?.country
                      ].filter(Boolean).join(', ')
                    )}
                  </p>
                  <table>
                    <thead>
                      <tr><th>Product</th><th>Size</th><th>Quantity</th></tr>
                    </thead>
                    <tbody>
                      ${(order.store_order_items || [])
                        .map(
                          (item) => `
                            <tr>
                              <td>${escapeHtml(item.product_name)}</td>
                              <td>${escapeHtml(item.variant_size)}</td>
                              <td>${item.quantity}</td>
                            </tr>`
                        )
                        .join('')}
                    </tbody>
                  </table>
                </div>`
              )
              .join('')}

            <div class="notice">
              <strong>Research use only.</strong> Products are supplied for controlled laboratory
              research and are not for human or veterinary use, ingestion, injection, diagnosis,
              treatment, or consumption.
            </div>

            <script>window.print();<\/script>
          </body>
        </html>
      `);

      reportWindow.document.close();
    }

    async function updateArchive(action) {
      if (!selectedOrders.size) return;

      const button = action === 'archive' ? archiveSelected : restoreSelected;
      button.disabled = true;

      try {
        const response = await fetch('/api/admin-orders', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': adminPassword
          },
          body: JSON.stringify({
            action,
            order_ids: [...selectedOrders]
          })
        });

        if (!response.ok) {
          throw new Error('Archive update failed.');
        }

        selectedOrders.clear();
        await loadOrders();
      } catch (error) {
        ordersMessage.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }

    async function attemptLogin() {
      adminPassword = passwordInput.value.trim();
      loginError.hidden = true;

      try {
        sessionStorage.setItem('altapure_admin_password', adminPassword);
        await loadOrders();
      } catch (error) {
        sessionStorage.removeItem('altapure_admin_password');
        loginError.textContent = error.message;
        loginError.hidden = false;
      }
    }

    loginButton.addEventListener('click', attemptLogin);

    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') attemptLogin();
    });

    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value.trim();

      clearTimeout(window.adminSearchTimeout);
      window.adminSearchTimeout = setTimeout(() => {
        loadOrders().catch((error) => {
          ordersMessage.textContent = error.message;
        });
      }, 350);
    });

    statusTabs.addEventListener('click', (event) => {
      const tab = event.target.closest('.tab');

      if (!tab) return;

      statusTabs.querySelectorAll('.tab').forEach((item) => {
        item.classList.remove('active');
      });

      tab.classList.add('active');
      currentStatus = tab.dataset.status;
      selectedOrders.clear();

      loadOrders().catch((error) => {
        ordersMessage.textContent = error.message;
      });
    });

    generatePdf.addEventListener('click', generateSupplierPdf);
    archiveSelected.addEventListener('click', () => updateArchive('archive'));
    restoreSelected.addEventListener('click', () => updateArchive('unarchive'));

    clearSelection.addEventListener('click', () => {
      selectedOrders.clear();
      updateBulkBar();
      renderOrders(loadedOrders);
    });

    refreshButton.addEventListener('click', async () => {
      refreshButton.disabled = true;
      refreshButton.textContent = 'Refreshing…';

      try {
        await loadOrders();
      } catch (error) {
        ordersMessage.textContent = error.message;
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = 'Refresh';
      }
    });

    if (adminPassword) {
      loadOrders().catch(() => {
        sessionStorage.removeItem('altapure_admin_password');
      });
    }
  </script>
</body>
</html>
