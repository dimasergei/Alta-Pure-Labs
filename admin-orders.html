<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Orders — AltaPure Labs</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23163832'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='22' font-family='Arial' fill='white'%3EAP%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --admin-bg: #0b0f10;
      --admin-panel: #121718;
      --admin-panel-soft: #171d1e;
      --admin-border: #232b2c;
      --admin-text: #e8edeb;
      --admin-muted: #8d9a96;
      --admin-teal: #59c2b4;
      --admin-teal-soft: #17302c;
    }

    body {
      background: var(--admin-bg);
      color: var(--admin-text);
    }

    .admin-page {
      min-height: 100svh;
      padding: 28px clamp(16px, 4vw, 48px) 80px;
    }

    .admin-shell {
      max-width: 1120px;
      margin: auto;
    }

    .admin-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .admin-title {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.03em;
    }

    .admin-subtitle {
      margin: 4px 0 0;
      color: var(--admin-muted);
      font-size: 13px;
    }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 16px;
      border: 1px solid var(--admin-border);
      border-radius: 100px;
      background: transparent;
      color: var(--admin-text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease;
    }

    .ghost-button:hover,
    .ghost-button:focus-visible {
      border-color: var(--admin-teal);
      color: var(--admin-teal);
    }

    .ghost-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .login-card {
      max-width: 420px;
      margin: 80px auto 0;
      padding: 34px;
      background: var(--admin-panel);
      border: 1px solid var(--admin-border);
      text-align: center;
    }

    .login-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .login-card p {
      margin: 0 0 24px;
      color: var(--admin-muted);
      font-size: 14px;
    }

    .login-field {
      display: grid;
      gap: 7px;
      margin-bottom: 18px;
      text-align: left;
    }

    .login-field label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--admin-muted);
    }

    .login-field input {
      padding: 14px;
      border: 1px solid var(--admin-border);
      background: #0e1314;
      color: var(--admin-text);
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--admin-teal);
    }

    .primary-button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 100px;
      background: var(--admin-teal);
      color: #06201d;
      font-weight: 700;
      cursor: pointer;
      transition: filter .2s ease;
    }

    .primary-button:hover,
    .primary-button:focus-visible {
      filter: brightness(1.08);
    }

    .primary-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .error {
      margin: 12px 0 0;
      color: #ff8a8a;
      font-size: 13px;
    }

    .orders {
      display: grid;
      gap: 10px;
    }

    .order {
      background: var(--admin-panel);
      border: 1px solid var(--admin-border);
      overflow: hidden;
      transition: border-color .2s ease;
    }

    .order:hover,
    .order:focus-within {
      border-color: #31403e;
    }

    .order-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(130px, 1.1fr) minmax(0, 1.6fr) 100px 130px 34px;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .order-row:hover {
      background: var(--admin-panel-soft);
    }

    .order-number {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .order-date {
      display: block;
      margin-top: 3px;
      color: var(--admin-muted);
      font-size: 12px;
    }

    .customer-preview strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
    }

    .customer-preview span {
      display: block;
      color: var(--admin-muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .order-total {
      font-weight: 700;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .status-pill {
      display: inline-flex;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-paid {
      background: #17302c;
      color: #7fd7c7;
    }

    .status-processing {
      background: #3a2c14;
      color: #f0c073;
    }

    .status-shipped {
      background: #182c44;
      color: #8db8ff;
    }

    .status-delivered {
      background: #17302c;
      color: #7fd7c7;
    }

    .status-canceled {
      background: #3d1c1c;
      color: #ff9a9a;
    }

    .chevron {
      color: var(--admin-muted);
      font-size: 20px;
      line-height: 1;
      text-align: center;
      transition: transform .2s ease;
    }

    .order.open .chevron {
      transform: rotate(180deg);
    }

    .order-details {
      display: none;
      padding: 0 18px 20px;
      border-top: 1px solid var(--admin-border);
    }

    .order.open .order-details {
      display: block;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding-top: 20px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--admin-muted);
    }

    .items {
      border: 1px solid var(--admin-border);
      background: #0e1314;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--admin-border);
      font-size: 14px;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: 600;
    }

    .item-variant {
      display: block;
      margin-top: 2px;
      color: var(--admin-muted);
      font-size: 12px;
    }

    .address {
      margin: 0;
      color: var(--admin-muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .address strong {
      color: var(--admin-text);
    }

    .fulfillment {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--admin-border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--admin-muted);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--admin-border);
      background: #0e1314;
      color: var(--admin-text);
      font: inherit;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--admin-teal);
    }

    .field textarea {
      min-height: 72px;
      resize: vertical;
    }

    .save-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .save-button {
      min-width: 160px;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--admin-muted);
    }

    @media (max-width: 860px) {
      .order-row {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "number chevron"
          "customer chevron"
          "total status";
        row-gap: 10px;
      }

      .order-number {
        grid-area: number;
      }

      .customer-preview {
        grid-area: customer;
      }

      .order-total {
        grid-area: total;
        text-align: left;
      }

      .status-pill {
        grid-area: status;
        justify-self: end;
      }

      .chevron {
        grid-area: chevron;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="admin-page">
    <div class="admin-shell">
      <div id="login-view">
        <div class="login-card">
          <h2>Admin access</h2>
          <p>Enter your password to manage orders.</p>

          <div class="login-field">
            <label for="admin-password">Admin password</label>
            <input id="admin-password" type="password" autocomplete="current-password">
          </div>

          <button id="login-button" class="primary-button" type="button">View orders</button>
          <p id="login-error" class="error" hidden></p>
        </div>
      </div>

      <div id="orders-view" hidden>
        <div class="admin-top">
          <div>
            <h1 class="admin-title">Orders</h1>
            <p class="admin-subtitle" id="orders-message">Loading orders…</p>
          </div>

          <div class="admin-actions">
            <button id="refresh-button" class="ghost-button" type="button">Refresh</button>
            <a class="ghost-button" href="/">Site</a>
          </div>
        </div>

        <div id="orders-list" class="orders"></div>
      </div>
    </div>
  </main>

  <script>
    const passwordInput = document.querySelector('#admin-password');
    const loginButton = document.querySelector('#login-button');
    const loginError = document.querySelector('#login-error');
    const loginView = document.querySelector('#login-view');
    const ordersView = document.querySelector('#orders-view');
    const ordersMessage = document.querySelector('#orders-message');
    const ordersList = document.querySelector('#orders-list');
    const refreshButton = document.querySelector('#refresh-button');

    let adminPassword = sessionStorage.getItem('altapure_admin_password') || '';

    const money = (cents, currency = 'USD') =>
      new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency
      }).format(cents / 100);

    const escapeHtml = (value) =>
      String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

    const formatStatus = (status) => {
      const labels = {
        paid: 'Paid',
        processing: 'Processing',
        shipped: 'Shipped',
        delivered: 'Delivered',
        canceled: 'Canceled'
      };

      return labels[status] || status;
    };

    const formatDate = (value) => {
      if (!value) return '—';

      return new Date(value).toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    };

    async function loadOrders() {
      ordersMessage.textContent = 'Loading orders…';

      const response = await fetch('/api/admin-orders', {
        headers: {
          'x-admin-password': adminPassword
        }
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Unable to load orders.');
      }

      const data = await response.json();
      renderOrders(data.orders || []);
    }

    function renderOrders(orders) {
      ordersView.hidden = false;
      loginView.hidden = true;

      ordersMessage.textContent = `${orders.length} order${orders.length === 1 ? '' : 's'} · click an order to expand`;

      if (!orders.length) {
        ordersList.innerHTML = `
          <div class="empty">
            <p>No orders yet.</p>
          </div>`;
        return;
      }

      ordersList.innerHTML = orders.map((order) => {
        const address = order.shipping_address || {};
        const addressText = [
          address.line1,
          address.line2,
          [address.city, address.state, address.postal_code].filter(Boolean).join(', '),
          address.country
        ].filter(Boolean).join('<br>');

        const items = (order.store_order_items || [])
          .map(
            (item) => `
              <div class="item">
                <div>
                  <span class="item-name">${escapeHtml(item.product_name)}</span>
                  <span class="item-variant">${escapeHtml(item.variant_size)} × ${item.quantity}</span>
                </div>
                <strong>${money(item.quantity * item.unit_price_cents, order.currency)}</strong>
              </div>`
          )
          .join('');

        return `
          <article class="order" data-order-id="${escapeHtml(order.id)}">
            <button
              class="order-row"
              type="button"
              aria-expanded="false"
              aria-controls="details-${escapeHtml(order.id)}"
            >
              <div>
                <span class="order-number">${escapeHtml(order.order_number || order.id)}</span>
                <span class="order-date">${formatDate(order.created_at)}</span>
              </div>

              <div class="customer-preview">
                <strong>${escapeHtml(order.customer_name)}</strong>
                <span>${escapeHtml(order.customer_email)}</span>
              </div>

              <div class="order-total">
                ${money(order.total_cents, order.currency)}
              </div>

              <div>
                <span class="status-pill status-${escapeHtml(order.fulfillment_status)}">
                  ${escapeHtml(formatStatus(order.fulfillment_status))}
                </span>
              </div>

              <span class="chevron" aria-hidden="true">⌄</span>
            </button>

            <div class="order-details" id="details-${escapeHtml(order.id)}">
              <div class="details-grid">
                <div>
                  <h3 class="section-title">Customer</h3>
                  <p class="address">
                    <strong>${escapeHtml(order.customer_name)}</strong><br>
                    ${escapeHtml(order.customer_email)}<br>
                    ${escapeHtml(order.organization || '')}
                  </p>

                  <h3 class="section-title" style="margin-top:22px;">Items</h3>
                  <div class="items">${items}</div>
                </div>

                <div>
                  <h3 class="section-title">Shipping</h3>
                  <p class="address">
                    <strong>${escapeHtml(order.shipping_name || '')}</strong><br>
                    ${addressText}
                  </p>

                  <div class="fulfillment">
                    <h3 class="section-title">Fulfillment</h3>

                    <form class="form-grid">
                      <label class="field">
                        Status
                        <select name="fulfillment_status">
                          ${['paid', 'processing', 'shipped', 'delivered', 'canceled']
                            .map(
                              (status) => `
                                <option value="${status}" ${order.fulfillment_status === status ? 'selected' : ''}>
                                  ${formatStatus(status)}
                                </option>`
                            )
                            .join('')}
                        </select>
                      </label>

                      <label class="field">
                        Carrier
                        <input name="tracking_carrier" value="${escapeHtml(order.tracking_carrier || '')}">
                      </label>

                      <label class="field">
                        Tracking number
                        <input name="tracking_number" value="${escapeHtml(order.tracking_number || '')}">
                      </label>

                      <label class="field full">
                        Internal notes
                        <textarea name="admin_notes" rows="3">${escapeHtml(order.admin_notes || '')}</textarea>
                      </label>

                      <div class="save-row full">
                        <button class="primary-button save-button" type="submit">Save changes</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </article>`;
      }).join('');

      ordersList.querySelectorAll('.order-row').forEach((row) => {
        row.addEventListener('click', () => {
          const order = row.closest('.order');
          const isOpen = order.classList.contains('open');

          ordersList.querySelectorAll('.order.open').forEach((openOrder) => {
            openOrder.classList.remove('open');
            openOrder.querySelector('.order-row').setAttribute('aria-expanded', 'false');
          });

          if (!isOpen) {
            order.classList.add('open');
            row.setAttribute('aria-expanded', 'true');
          }
        });
      });

      ordersList.querySelectorAll('form').forEach((form) => {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const article = event.target.closest('.order');
          const orderId = article.dataset.orderId;
          const formData = new FormData(event.target);

          const button = event.target.querySelector('button');
          button.disabled = true;
          button.textContent = 'Saving…';

          try {
            const response = await fetch('/api/admin-orders', {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'x-admin-password': adminPassword
              },
              body: JSON.stringify({
                order_id: orderId,
                fulfillment_status: formData.get('fulfillment_status'),
                tracking_carrier: formData.get('tracking_carrier'),
                tracking_number: formData.get('tracking_number'),
                admin_notes: formData.get('admin_notes')
              })
            });

            if (!response.ok) {
              throw new Error('Update failed.');
            }

            button.textContent = 'Saved';
            await loadOrders();
          } catch (error) {
            button.textContent = 'Try again';
          } finally {
            button.disabled = false;
          }
        });
      });
    }

    async function attemptLogin() {
      adminPassword = passwordInput.value.trim();
      loginError.hidden = true;

      try {
        sessionStorage.setItem('altapure_admin_password', adminPassword);
        await loadOrders();
      } catch (error) {
        sessionStorage.removeItem('altapure_admin_password');
        loginError.textContent = error.message;
        loginError.hidden = false;
      }
    }

    loginButton.addEventListener('click', attemptLogin);

    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        attemptLogin();
      }
    });

    refreshButton.addEventListener('click', async () => {
      refreshButton.disabled = true;
      refreshButton.textContent = 'Refreshing…';

      try {
        await loadOrders();
      } catch (error) {
        ordersMessage.textContent = error.message;
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = 'Refresh';
      }
    });

    if (adminPassword) {
      loadOrders().catch(() => {
        sessionStorage.removeItem('altapure_admin_password');
      });
    }
  </script>
</body>
</html>
